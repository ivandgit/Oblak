<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Čelični Oblak — Coming Soon</title>
  <meta name="description" content="Čelični Oblak — Coming Soon">
  <style>
    :root {
      color-scheme: dark;
      --bg: #07090d;
      --text: #e9edf3;
      --muted: #8e98a7;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      display: grid;
      place-items: center;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 42%, rgba(70, 88, 116, .18), transparent 34rem),
        linear-gradient(135deg, #06080c 0%, #0c1119 48%, #05070a 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .12;
      background-image:
        repeating-linear-gradient(
          115deg,
          rgba(255,255,255,.05) 0,
          rgba(255,255,255,.05) 1px,
          transparent 1px,
          transparent 5px
        );
      mask-image: radial-gradient(circle at center, #000 0 35%, transparent 80%);
    }

    .wrap {
      width: min(92vw, 760px);
      text-align: center;
      transform: translateY(-2vh);
    }

    .logo {
      display: block;
      width: min(78vw, 520px);
      margin: 0 auto;
      border: 0;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 18px 32px rgba(0,0,0,.62));
      -webkit-mask-image: linear-gradient(
        to right,
        transparent 0%,
        #000 10%,
        #000 90%,
        transparent 100%
      );
      mask-image: linear-gradient(
        to right,
        transparent 0%,
        #000 10%,
        #000 90%,
        transparent 100%
      );
      animation: breathe 5s ease-in-out infinite;
    }

    .coming-soon {
      margin: 2.1rem 0 0;
      font-size: clamp(.82rem, 1.7vw, 1.05rem);
      font-weight: 500;
      letter-spacing: .62em;
      text-indent: .62em;
      color: rgba(233,237,243,.76);
    }

    .line {
      width: 54px;
      height: 1px;
      margin: 1.45rem auto 0;
      background: linear-gradient(to right, transparent, rgba(255,255,255,.55), transparent);
    }

    @keyframes breathe {
      0%, 100% {
        transform: scale(1);
        opacity: .96;
      }
      50% {
        transform: scale(1.018);
        opacity: 1;
      }
    }

    @media (max-width: 520px) {
      .logo {
        width: 94vw;
      }

      .coming-soon {
        margin-top: 1.4rem;
        letter-spacing: .42em;
        text-indent: .42em;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo {
        animation: none;
      }
    }
  </style>
</head>
